plugins {
    id 'fabric-loom' version '1.13.6'
    id 'maven-publish'
    id "io.freefair.lombok" version "8.11"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/fevervisual.accesswidener")
}

repositories {
    mavenCentral()
    maven {
        name = "FirstDark"
        url = 'https://maven.firstdark.dev/releases'
    }
    maven {
        name = "Jitpack"
        url = uri("https://jitpack.io")
    }
}

configurations {
    libImplementation
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "org.nanohttpd:nanohttpd:2.3.1"
    include "org.nanohttpd:nanohttpd:2.3.1"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    include "com.google.code.findbugs:jsr305:3.0.2"

    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    include "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"

    implementation "net.java.dev.jna:jna:5.14.0"
    include "net.java.dev.jna:jna:5.14.0"

    implementation "org.luaj:luaj-jse:3.0.1"
    include "org.luaj:luaj-jse:3.0.1"

    modImplementation "dev.redstones.mediaplayerinfo:media-player-info:${project.mediaplayer_version}"
    include "dev.redstones.mediaplayerinfo:media-player-info:${project.mediaplayer_version}"

    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude("META-INF/versions/**")
    exclude("META-INF/*.SF")
    exclude("META-INF/*.DSA")
    exclude("META-INF/*.RSA")
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
